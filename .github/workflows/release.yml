name: Release

# Pushing a tag vX.Y.Z, where X.Y.Z is the version in pubspec.yaml, uploads the iOS app to App Store
# Connect and submits it to TestFlight and App Review, builds, signs and notarizes the macOS app,
# publishes the GitHub release, and then updates the Homebrew cask and the Scoop manifest
# (packages.yml). Run by hand it does everything up to
# publishing: the iOS build is exported but not uploaded, and the macOS and Windows zips are kept as
# artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A release in progress is not abandoned for a newer one: its files are half made and its tag exists.
concurrency:
  group: release
  cancel-in-progress: false

# Flutter's version is pinned in pubspec.yaml (environment.flutter), for CI and here alike.
env:
  XCODE_VERSION: '27.0'
  TEAM_ID: 33832Z66QU

jobs:
  # The tag must name the pubspec version; the tests run before anything is signed or uploaded.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        id: version
        run: |
          version="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the pubspec version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Archived unsigned, so the build never makes a development certificate on the team (each runner is
  # new, and Xcode would add one per run until the team's limit). The archive is then signed ad hoc with
  # each target's entitlements, which the export keeps, and the export signs it through the App Store
  # Connect API key with the cloud-managed Apple Distribution certificate.
  ios:
    needs: check
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The Xcode the app is released with, not whichever one the image happens to default to.
      - name: Select Xcode 27.0
        run: |
          xcode_app=""
          for app in /Applications/Xcode_"$XCODE_VERSION"*.app; do
            [ -d "$app" ] && xcode_app="$app"
          done
          [ -n "$xcode_app" ] || { echo "::error::Xcode $XCODE_VERSION is not installed on this image" >&2; exit 1; }
          sudo xcode-select --switch "$xcode_app/Contents/Developer"
          xcodebuild -version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - name: Install the App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!name}" ] || { echo "::error::the secret $name is not set" >&2; exit 1; }
          done
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "ASC_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "ASC_KEY_ID=$APPLE_API_KEY_ID"
            echo "ASC_ISSUER=$APPLE_API_ISSUER_ID"
          } >> "$GITHUB_ENV"
      # The build number is the run number, so every upload is newer than the one before it.
      - name: Configure the Flutter build
        run: flutter build ios --release --config-only --build-number="$GITHUB_RUN_NUMBER"
      - name: Archive unsigned
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
      - name: Sign the archive ad hoc with its entitlements
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          codesign -f -s - --entitlements ios/TatWidgets/TatWidgets.entitlements "$app/PlugIns/TatWidgets.appex"
          for framework in "$app"/Frameworks/*; do codesign -f -s - "$framework"; done
          codesign -f -s - --entitlements ios/Runner/Runner.entitlements "$app"
      # A tag uploads to App Store Connect, where the build reaches TestFlight; a manual run only exports.
      - name: Export and upload
        run: |
          destination=export
          [ "$GITHUB_EVENT_NAME" = push ] && destination=upload
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$destination</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  # Once the build is processed: the listing in fastlane/metadata/ios and the What's New go on the App Store
  # version, the build goes to the external TestFlight groups and beta review, and the version to App Review.
  # Its own job, so a refused submission never holds back the other releases.
  app-store:
    if: github.event_name == 'push'
    needs: [check, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            fastlane/metadata/ios
            distribution/whatsnew
      - name: Submit
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          export ASC_KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$ASC_KEY"' EXIT
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY"
          python3 scripts/app-store-release.py "$VERSION" "$GITHUB_RUN_NUMBER"

  # Archived unsigned and signed ad hoc with the app's entitlements, as the iOS job does, then exported
  # with the Developer ID certificate in a temporary keychain and the profile its keychain entitlement
  # needs, fetched through the API key (scripts/developer-id-profile.py), which also notarizes.
  macos:
    needs: check
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 27.0
        run: |
          xcode_app=""
          for app in /Applications/Xcode_"$XCODE_VERSION"*.app; do
            [ -d "$app" ] && xcode_app="$app"
          done
          [ -n "$xcode_app" ] || { echo "::error::Xcode $XCODE_VERSION is not installed on this image" >&2; exit 1; }
          sudo xcode-select --switch "$xcode_app/Contents/Developer"
          xcodebuild -version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - name: Install the signing certificate and the API key
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERT_PASSWORD ASC_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!name}" ] || { echo "::error::the secret $name is not set" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          # Keep the existing keychains searchable; the list is split on purpose.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"; then
            echo "::error::MACOS_CERTIFICATE_P12_BASE64 contains no Developer ID Application certificate" >&2
            exit 1
          fi
          {
            echo "ASC_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "ASC_KEY_ID=$APPLE_API_KEY_ID"
            echo "ASC_ISSUER=$APPLE_API_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Configure the Flutter build
        run: flutter build macos --release --config-only --build-number="$GITHUB_RUN_NUMBER"
      # Xcode would make this profile only through cloud-managed certificates.
      - name: Fetch the Developer ID profile
        run: |
          set -euo pipefail
          serial="$(security find-certificate -c "Developer ID Application" -p "$RUNNER_TEMP/build.keychain-db" \
            | openssl x509 -noout -serial | cut -d= -f2)"
          profile="$(python3 scripts/developer-id-profile.py "$serial")"
          echo "PROFILE_NAME=$profile" >> "$GITHUB_ENV"
      - name: Archive unsigned, then export with Developer ID
        run: |
          xcodebuild archive \
            -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination generic/platform=macOS -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
          app="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/TAT CCU.app"
          # The entitlements as Xcode would expand them; the hardened runtime is kept by the export.
          sed "s/\$(AppIdentifierPrefix)/$TEAM_ID./" macos/Runner/Release.entitlements > "$RUNNER_TEMP/app.entitlements"
          find "$app/Contents/Frameworks" -maxdepth 1 -name '*.framework' -exec codesign -f -s - --options runtime {} \;
          codesign -f -s - --options runtime --entitlements "$RUNNER_TEMP/app.entitlements" "$app"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.github.koukeneko.tatCcu</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
      - name: Notarize and staple
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/export/TAT CCU.app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          auth=(--key "$ASC_KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER")
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait --output-format json "${auth[@]}" \
            > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          # Apple's log says which file it rejected and why.
          if [ "$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json")" != Accepted ]; then
            xcrun notarytool log "$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json")" "${auth[@]}"
            exit 1
          fi
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose "$app"
          # The zip Homebrew installs from carries the stapled ticket.
          ditto -c -k --keepParent "$app" "dist/TAT-CCU-$VERSION-macos.zip"
      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/TAT-CCU-${{ env.VERSION }}-macos.zip
          if-no-files-found: error

  # Signed with the upload key in the repository secrets (ANDROID_KEYSTORE_BASE64 and its password).
  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - name: Install the upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::the secret $name is not set" >&2; exit 1; }
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      # The password reaches these steps only, not the rest of the job. The
      # bundle is what Google Play takes; the APK is for the GitHub release.
      - run: |
          flutter build apk --release --build-number="$GITHUB_RUN_NUMBER"
          flutter build appbundle --release --build-number="$GITHUB_RUN_NUMBER"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Check the signature
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -q "CN=TAT CCU" \
            || { echo "::error::the APK is not signed with the upload key" >&2; exit 1; }
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/TAT-CCU-$VERSION-android.apk"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/TAT-CCU-${{ env.VERSION }}-android.apk
          if-no-files-found: error
      # Kept apart from the release files: the play job uploads it to Google Play.
      - uses: actions/upload-artifact@v7
        with:
          name: play
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # Uploads the bundle to Google Play's production track as a draft: rolling it out stays a Play Console
  # click. No key is stored: GitHub's OIDC token is exchanged through Workload Identity Federation (zentring
  # project, pool github, provider tat-ccu, which only accepts this repository) for the tat-ccu-play service
  # account, which Play Console lets release and edit the listing of TAT CCU only. Its own job, so a Play
  # problem never holds back the GitHub release.
  play:
    if: github.event_name == 'push'
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: distribution/whatsnew
      - uses: actions/download-artifact@v8
        with:
          name: play
          path: play
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/817104977407/locations/global/workloadIdentityPools/github/providers/tat-ccu
          service_account: tat-ccu-play@zentring.iam.gserviceaccount.com
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: io.github.koukeneko.tat_ccu
          releaseFiles: play/app-release.aab
          tracks: production
          status: draft
          whatsNewDirectory: distribution/whatsnew

  # Unsigned until there is a code signing certificate for Windows.
  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - run: flutter build windows --release --build-number="$env:GITHUB_RUN_NUMBER"
      - name: Zip the app folder
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\TAT-CCU-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/TAT-CCU-${{ env.VERSION }}-windows-x64.zip
          if-no-files-found: error

  # The iOS upload is not waited for: a problem on App Store Connect never holds back the macOS release.
  publish:
    if: github.event_name == 'push'
    needs: [check, macos, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: distribution/release-notes
      - uses: actions/download-artifact@v8
        with:
          pattern: '{macos,android}'
          path: dist
          merge-multiple: true
      # The Homebrew cask reads its hash from here.
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        # The notes written for this tag, or ones generated from the commits.
        run: |
          notes="distribution/release-notes/$GITHUB_REF_NAME.md"
          if [[ -f $notes ]]; then source=(--notes-file "$notes"); else source=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "TAT CCU $VERSION" "${source[@]}"

  # Attached to the release that publish made, so a failed Windows job leaves the macOS release and the
  # Homebrew cask as they are.
  publish-windows:
    if: github.event_name == 'push'
    needs: [publish, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS-windows
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  packages:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ github.ref_name }}
      package: homebrew
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  packages-scoop:
    needs: publish-windows
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ github.ref_name }}
      package: scoop
    secrets:
      SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
