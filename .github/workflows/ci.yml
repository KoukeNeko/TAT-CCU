name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

# A newer push to the same branch or pull request makes the run before it pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatted
        run: dart format --output=none --set-exit-if-changed lib
      - run: flutter analyze
      - run: flutter test
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh
