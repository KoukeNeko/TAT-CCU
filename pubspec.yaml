name: tat_ccu
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  go_router: ^17.5.0
  http: ^1.6.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  pdfrx: ^2.6.5
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # LINE Seed (SIL OFL 1.1; licenses in assets/fonts). Thin is left out to
  # keep the app smaller; w900 falls back to ExtraBold.
  fonts:
    - family: LINESeedTW
      fonts:
        - asset: assets/fonts/LINESeedTW_TTF_Rg.ttf
          weight: 400
        - asset: assets/fonts/LINESeedTW_TTF_Bd.ttf
          weight: 700
        - asset: assets/fonts/LINESeedTW_TTF_Eb.ttf
          weight: 800
    - family: LINESeedJP
      fonts:
        - asset: assets/fonts/LINESeedJP_A_TTF_Rg.ttf
          weight: 400
        - asset: assets/fonts/LINESeedJP_A_TTF_Bd.ttf
          weight: 700
        - asset: assets/fonts/LINESeedJP_A_TTF_Eb.ttf
          weight: 800
